<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CBT Web App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
      <span class="navbar-brand fw-bold">CBT Web</span>
      <div id="navUser" class="d-none text-white"></div>
    </div>
  </nav>

  <main class="container py-4">
    <div id="alertContainer"></div>

    <section id="loginView" class="row justify-content-center">
      <div class="col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h3>Login CBT</h3>
            <p class="text-muted mb-3">Admin: admin/admin123 | Guru: guru/guru123 | Siswa: siswa/siswa123</p>
            <form id="loginForm" class="vstack gap-2">
              <input class="form-control" name="username" placeholder="Username" required />
              <input class="form-control" type="password" name="password" placeholder="Password" required />
              <button class="btn btn-primary">Masuk</button>
            </form>
          </div>
        </div>
      </div>
    </section>

    <section id="appView" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h4 id="roleTitle" class="mb-0"></h4>
        <button id="btnLogout" class="btn btn-outline-danger btn-sm">Logout</button>
      </div>

      <div id="adminView" class="d-none"></div>
      <div id="teacherView" class="d-none"></div>
      <div id="studentView" class="d-none"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
