<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CBT Web App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <nav class="navbar navbar-dark shadow-sm glass-nav">
    <div class="container">
      <span class="navbar-brand fw-bold brand-title">CBT Web</span>
      <div id="navUser" class="d-none text-white user-pill"></div>
    </div>
  </nav>

  <main class="container py-4 app-shell">
    <div id="alertContainer"></div>

    <section id="loginView" class="row justify-content-center">
      <div class="col-lg-5 col-xl-4">
        <div class="card shadow-soft login-card">
          <div class="card-body p-4 p-lg-5">
            <p class="eyebrow mb-2">Selamat Datang 👋</p>
            <h3 class="mb-2">Login CBT</h3>
            <p class="text-muted mb-4 small">Admin: admin/admin123 · Guru: guru/guru123 · Siswa: siswa/siswa123</p>
            <form id="loginForm" class="vstack gap-3">
              <input class="form-control input-modern" name="username" placeholder="Username" required />
              <input class="form-control input-modern" type="password" name="password" placeholder="Password" required />
              <button class="btn btn-grad">Masuk</button>
            </form>
          </div>
        </div>
      </div>
    </section>

    <section id="appView" class="d-none">
      <div class="header-panel mb-3">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
          <h4 id="roleTitle" class="mb-0 role-title"></h4>
          <button id="btnLogout" class="btn btn-light btn-sm btn-logout">Logout</button>
        </div>
      </div>

      <div id="adminView" class="d-none"></div>
      <div id="teacherView" class="d-none"></div>
      <div id="studentView" class="d-none"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
