{% extends 'base.html' %}
{% block content %}
<h2>Kelola Pengguna</h2>
<div class="row g-4">
  <div class="col-md-4">
    <div class="card"><div class="card-body">
      <h5>Tambah Pengguna</h5>
      <form method="post">
        <input class="form-control mb-2" name="full_name" placeholder="Nama lengkap" required>
        <input class="form-control mb-2" name="username" placeholder="Username" required>
        <input type="password" class="form-control mb-2" name="password" placeholder="Password" required>
        <select class="form-select mb-2" name="role" required>
          <option value="student">Siswa</option>
          <option value="teacher">Guru</option>
          <option value="admin">Admin</option>
        </select>
        <input class="form-control mb-2" name="student_class" placeholder="Kelas (untuk siswa)">
        <button class="btn btn-primary w-100">Simpan</button>
      </form>
    </div></div>
  </div>
  <div class="col-md-8">
    <div class="card"><div class="card-body table-responsive">
      <table class="table">
        <thead><tr><th>Nama</th><th>Username</th><th>Role</th><th>Kelas</th></tr></thead>
        <tbody>
          {% for u in users %}
          <tr><td>{{ u.full_name }}</td><td>{{ u.username }}</td><td>{{ u.role }}</td><td>{{ u.student_class or '-' }}</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div></div>
  </div>
</div>
{% endblock %}
