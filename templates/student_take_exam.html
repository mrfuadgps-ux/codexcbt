{% extends 'base.html' %}
{% block content %}
<h2>{{ exam.title }}</h2>
<p class="text-muted">Durasi {{ exam.duration_minutes }} menit</p>
<form method="post">
  {% for q in questions %}
  <div class="card mb-3"><div class="card-body">
    <p><strong>{{ loop.index }}. {{ q.question_text }}</strong></p>
    {% for opt in ['A','B','C','D'] %}
      <div class="form-check">
        <input class="form-check-input" type="radio" name="q_{{ q.id }}" value="{{ opt }}" id="q{{ q.id }}{{ opt }}">
        <label class="form-check-label" for="q{{ q.id }}{{ opt }}">{{ opt }}. {{ q['option_' + opt.lower()] }}</label>
      </div>
    {% endfor %}
  </div></div>
  {% else %}
  <div class="alert alert-warning">Belum ada soal pada ujian ini.</div>
  {% endfor %}
  <button class="btn btn-success">Kumpulkan Jawaban</button>
</form>
{% endblock %}
