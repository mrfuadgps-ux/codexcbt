{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">Dashboard Admin</h2>
<div class="row g-3 mb-4">
  <div class="col-md-4"><div class="metric-card"><h5>Total User</h5><p>{{ stats.users }}</p></div></div>
  <div class="col-md-4"><div class="metric-card"><h5>Total Ujian</h5><p>{{ stats.exams }}</p></div></div>
  <div class="col-md-4"><div class="metric-card"><h5>Total Jadwal</h5><p>{{ stats.schedules }}</p></div></div>
</div>
<div class="d-flex gap-2 flex-wrap">
  <a class="btn btn-primary" href="{{ url_for('admin_users') }}">Kelola Pengguna</a>
  <a class="btn btn-success" href="{{ url_for('admin_exams') }}">Kelola Ujian</a>
  <a class="btn btn-warning" href="{{ url_for('import_data') }}">Import Data</a>
  <a class="btn btn-dark" href="{{ url_for('export_all') }}">Export Semua Data</a>
</div>
{% endblock %}
