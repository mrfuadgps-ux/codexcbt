{% extends 'base.html' %}
{% block content %}
<h2>Import Data</h2>
<div class="card col-md-6">
  <div class="card-body">
    <p class="text-muted">Upload file JSON hasil export sistem.</p>
    <form method="post" enctype="multipart/form-data">
      <input class="form-control mb-3" type="file" name="file" accept="application/json" required>
      <button class="btn btn-warning">Import Sekarang</button>
    </form>
  </div>
</div>
{% endblock %}
